<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강원석의 자기소개</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      padding: 2rem;
    }

    h1 {
      font-size: clamp(3rem, 12vw, 8rem);
      font-weight: 800;
      background: linear-gradient(90deg, #38bdf8, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.2;
    }

    .intro {
      margin-top: 2.5rem;
    }

    .name {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 700;
      color: #f8fafc;
    }

    .desc {
      margin-top: 1rem;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: #94a3b8;
      max-width: 36rem;
      line-height: 1.7;
    }

    footer {
      position: fixed;
      bottom: 1rem;
      font-size: 0.85rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <h1>안녕, 세상!</h1>

  <div class="intro">
    <p class="name">나는 강원석이야</p>
    <p class="desc">
      반가워요! 저는 강원석입니다. 이 페이지는 아주 간단한 자기소개 페이지예요.
      만나서 즐겁습니다.
    </p>
  </div>

  <footer>&copy; 2026 강원석</footer>
</body>
</html>
